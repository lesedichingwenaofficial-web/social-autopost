name: Publish due posts

on:
  schedule:
    - cron: "4-59/5 * * * *"   # every 5 min, off the busy :00/:15 marks (GitHub can still run late)
  workflow_dispatch:          # "Run workflow" button to post due items right now

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        id: publish
        env:
          # One line per Instagram account (secret IG_TOKEN_<ACCOUNT>)
          IG_TOKEN_FORMULASIMPLE: ${{ secrets.IG_TOKEN_FORMULASIMPLE }}
          IG_TOKEN_CHEEKYFOUNDLAMB: ${{ secrets.IG_TOKEN_CHEEKYFOUNDLAMB }}
          IG_TOKEN_PARENTSGODLYWAREHOUSE: ${{ secrets.IG_TOKEN_PARENTSGODLYWAREHOUSE }}
          IG_TOKEN_PARENTSDISPATCHEDINFO: ${{ secrets.IG_TOKEN_PARENTSDISPATCHEDINFO }}
          POST_PRIVATE_KEY: ${{ secrets.POST_PRIVATE_KEY }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: python3 scripts/publish.py

      - name: Save post statuses
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "Update post statuses"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
