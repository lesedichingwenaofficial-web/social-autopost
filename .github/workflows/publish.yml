name: Publish due posts

# GitHub's cron is best-effort and often skips runs for an hour or more, so instead of relying on
# it the publisher stays running: one job checks every minute for ~5.5 hours, then starts its own
# successor. The schedule below is only a watchdog that restarts the loop if the chain ever breaks
# (while a loop is running, extra runs just wait in the concurrency queue and get replaced).
on:
  schedule:
    - cron: "7-59/15 * * * *"
  workflow_dispatch:          # "Run workflow" button to (re)start the publisher now
    inputs:
      minutes:
        description: How long this run keeps checking before handing over to the next run
        default: "320"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write              # lets the loop start its successor run

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Publish loop
        env:
          # One line per Instagram account (secret IG_TOKEN_<ACCOUNT>)
          IG_TOKEN_FORMULASIMPLE: ${{ secrets.IG_TOKEN_FORMULASIMPLE }}
          IG_TOKEN_CHEEKYFOUNDLAMB: ${{ secrets.IG_TOKEN_CHEEKYFOUNDLAMB }}
          IG_TOKEN_PARENTSGODLYWAREHOUSE: ${{ secrets.IG_TOKEN_PARENTSGODLYWAREHOUSE }}
          IG_TOKEN_PARENTSDISPATCHEDINFO: ${{ secrets.IG_TOKEN_PARENTSDISPATCHEDINFO }}
          IG_TOKEN_INFODISPATCHREAL: ${{ secrets.IG_TOKEN_INFODISPATCHREAL }}
          POST_PRIVATE_KEY: ${{ secrets.POST_PRIVATE_KEY }}
          LOOP_MINUTES: ${{ inputs.minutes || '320' }}
        run: |
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add posts autoreply-state.json 2>/dev/null || git add posts
            git diff --cached --quiet && return 0
            git commit -q -m "Update post statuses"
            for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && return 0; sleep 5; done
            echo "::warning::could not push post statuses"
          }
          end=$((SECONDS + LOOP_MINUTES * 60))
          last_reply=-600
          while [ $SECONDS -lt $end ]; do
            git pull --rebase -q || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            export MEDIA_BASE_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$(git rev-parse HEAD)"
            python3 scripts/publish.py || echo "::warning::publish.py reported failures (see above)"
            if [ $((SECONDS - last_reply)) -ge 300 ]; then   # keyword comment replies, every 5 min
              python3 scripts/autoreply.py || echo "::warning::autoreply.py failed"
              last_reply=$SECONDS
            fi
            save
            sleep 60
          done

      - name: Start the next publisher run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
