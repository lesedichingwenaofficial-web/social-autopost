name: Refresh Instagram tokens

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh tokens
        env:
          # One line per Instagram account (secret IG_TOKEN_<ACCOUNT>)
          IG_TOKEN_FORMULASIMPLE: ${{ secrets.IG_TOKEN_FORMULASIMPLE }}
          IG_TOKEN_CHEEKYFOUNDLAMB: ${{ secrets.IG_TOKEN_CHEEKYFOUNDLAMB }}
          IG_TOKEN_PARENTSGODLYWAREHOUSE: ${{ secrets.IG_TOKEN_PARENTSGODLYWAREHOUSE }}
          IG_TOKEN_PARENTSDISPATCHEDINFO: ${{ secrets.IG_TOKEN_PARENTSDISPATCHEDINFO }}
          IG_TOKEN_INFODISPATCHREAL: ${{ secrets.IG_TOKEN_INFODISPATCHREAL }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/refresh_tokens.py

      # GitHub pauses scheduled workflows in repos with no commits for 60 days.
      # A weekly heartbeat commit keeps the publisher alive during quiet periods.
      - name: Heartbeat
        if: always()
        run: |
          date -u +%FT%TZ > .github/heartbeat
          git config user.name "autopost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -qm "Heartbeat" && git pull --rebase -q && git push -q
